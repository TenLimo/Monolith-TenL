- type: entity
  id: ForerunnerMachineryDataFilter
  parent: BaseMachinePowered
  name: ancient data filter
  description: Various data keep popping up on the screen of this strange machine.
  suffix: Forge
  components:
  - type: Sprite
    sprite: _Forge/Structures/Decoration/machinery_forerunner.rsi
    snapCardinals: true
    layers:
    - state: datafilter
      visible: true
    - state: datafilter_unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: PowerSwitch
  - type: Anchorable
  - type: Pullable

- type: entity
  id: ForerunnerMachineryDataServer
  parent: ForerunnerMachineryDataFilter
  name: ancient data server
  description: A large and bulky server. It is noisy.
  suffix: Forge
  components:
  - type: Sprite
    sprite: _Forge/Structures/Decoration/machinery_forerunner.rsi
    snapCardinals: true
    layers:
    - state: dataserver
      visible: true
    - state: dataserver_unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]

- type: entity
  id: ForerunnerMachineryDataValidator
  parent: ForerunnerMachineryDataFilter
  name: ancient data validator
  description: An old-looking machine. You have no idea what it does.
  suffix: Forge
  components:
  - type: Sprite
    sprite: _Forge/Structures/Decoration/machinery_forerunner.rsi
    snapCardinals: true
    layers:
    - state: datavalidator
      visible: true
    - state: datavalidator_unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
